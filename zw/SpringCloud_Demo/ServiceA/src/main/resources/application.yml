server:
  port: 8081


spring:
  profiles:
    active: dev
  application:
    # nacos 通过 application.name 来命名注册服务
    name: Service-a
  config:
    import:
      - nacos:MYSQL.yml
      - nacos:Seata.yml
  cloud:
    nacos:
      discovery:
        # nacos 注册服务端口
        server-addr: 192.168.80.128:8848
      # nacos.config.shared-configs: - data-id: xxx
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        namespace: dev
        group: DEFAULT_GROUP